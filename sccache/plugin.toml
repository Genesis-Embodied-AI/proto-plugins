name = "sccache"
type = "cli"

[resolve]
git-url = "https://github.com/mozilla/sccache"

# Release tags are v-prefixed (e.g. v0.19.0); proto strips the leading "v" so the
# pinned version is bare semver and the download URL re-adds it via v{version}.
# Assets use Rust target triples whose arch tokens (x86_64/aarch64) match proto's
# native {arch}, so no arch mapping is needed. Each archive nests the binary inside
# a v-prefixed, triple-named directory. Linux uses the static musl build. Checksum
# files are bare lowercase sha256 digests, so verification works on every platform.
[platform.linux]
download-file = "sccache-v{version}-{arch}-unknown-linux-musl.tar.gz"
checksum-file = "sccache-v{version}-{arch}-unknown-linux-musl.tar.gz.sha256"
exe-path = "sccache-v{version}-{arch}-unknown-linux-musl/sccache"

[platform.macos]
download-file = "sccache-v{version}-{arch}-apple-darwin.tar.gz"
checksum-file = "sccache-v{version}-{arch}-apple-darwin.tar.gz.sha256"
exe-path = "sccache-v{version}-{arch}-apple-darwin/sccache"

[platform.windows]
download-file = "sccache-v{version}-{arch}-pc-windows-msvc.tar.gz"
checksum-file = "sccache-v{version}-{arch}-pc-windows-msvc.tar.gz.sha256"
exe-path = "sccache-v{version}-{arch}-pc-windows-msvc/sccache.exe"

[install]
download-url = "https://github.com/mozilla/sccache/releases/download/v{version}/{download_file}"
checksum-url = "https://github.com/mozilla/sccache/releases/download/v{version}/{checksum_file}"
