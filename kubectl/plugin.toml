name = "kubectl"
type = "cli"

# kubectl is versioned with Kubernetes; the kubernetes/kubectl repo only has
# v0.x mirror tags.
[resolve]
git-url = "https://github.com/kubernetes/kubernetes"
version-pattern = "^v((?<major>\\d+)\\.(?<minor>\\d+)\\.(?<patch>\\d+))$"

[install.arch]
aarch64 = "arm64"
x86_64 = "amd64"

[platform.linux]
download-file = "linux/{arch}/kubectl"
checksum-file = "linux/{arch}/kubectl.sha256"

[platform.macos]
download-file = "darwin/{arch}/kubectl"
checksum-file = "darwin/{arch}/kubectl.sha256"

[platform.windows]
download-file = "windows/{arch}/kubectl.exe"
checksum-file = "windows/{arch}/kubectl.exe.sha256"

[install]
download-url = "https://dl.k8s.io/release/v{version}/bin/{download_file}"
checksum-url = "https://dl.k8s.io/release/v{version}/bin/{checksum_file}"
unpack = false
